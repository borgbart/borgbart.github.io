<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BB2000</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;600;700&display=swap">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="icon" href="/images/favicon.png" type="image/x-icon">
</head>

<style>
    .coming-soon {
  position: relative;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #F7F4F3; /* light background */
  overflow: hidden;
}

.coming-soon h1 {
  font-size: 5rem;
  color: #22333B; /* darker font */
  z-index: 2;
}

/* Background repeating text */
.background-text {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  font-size: 4rem;
  color: rgba(34, 51, 59, 0.08); /* faint text */
  display: flex;
  flex-wrap: wrap;
  align-content: center;
  justify-content: center;
  gap: 2rem;
  pointer-events: none;
  z-index: 1;
}

.background-text::before {
  content: "Watch This Space Watch This Space Watch This Space ";
  white-space: pre-wrap;
}

</style>

<body>
    <div class="wrapper">
        <!-- nav.html -->
        <section class="home-header">
            <div id="nav-container"></div>
        </section>
    </div>

    <section class="coming-soon">
        <h1>Coming Soon</h1>
        <div class="background-text">More Handles Arriving Shortly</div>
      </section>

    <section class="home-header">
        <div id="footer-container"></div>
    </section>

    <!-- Link to the external script file -->
    <script src="/script.js"></script>
</body>
</body>
</html>
