<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPod M - BB2000</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;600;700&display=swap">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="icon" href="/images/favicon.png" type="image/x-icon">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ========== BRAND SWITCHER ========== */
    .brand-switcher {
      display: flex;
      flex-direction: row;
      flex: 1;
      width: 100%;
    }

    .brand {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.4s ease;
      filter: grayscale(100%) brightness(0.7);
      position: relative;
      text-align: center;
    }

    .brand:hover {
      filter: none;
    }

    /* Default for mobile: keep smaller */
    .brand picture,
    .brand img {
    max-width: 200px;
    width: 100%;
    height: auto;
    }

    /* Make logos larger on desktop */
    @media (min-width: 992px) {
    .brand picture,
    .brand img {
        max-width: 300px; /* increase size */
    }
    }

    @media (min-width: 1400px) {
    .brand picture,
    .brand img {
        max-width: 400px; /* even bigger on very wide screens */
    }
    }


    .brand:hover img {
      transform: scale(1.05);
    }

    /* Brand-specific backgrounds */
    .mandelli {
      background-color: #F7EEE6;
    }

    .fimet {
      background-color: #ffffff;
    }

    /* Full clickable area */
    .brand a {
      position: absolute;
      top: 0; left: 0;
      right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    /* MOBILE: stack vertically, always show full color */
    @media (max-width: 768px) {
      .brand-switcher {
        flex-direction: column;
      }

      .brand {
        filter: none; /* Full color by default */
        height: 50vh;
      }
    }
  </style>

</head>
<body>
    <div class="wrapper">
        <!-- Navigation -->
        <section class="home-header">
            <div id="nav-container"></div>
        </section>

    <!-- BRAND SWITCHER SECTION -->
    <section class="brand-switcher">
      <!-- Mandelli -->
      <div class="brand mandelli">
        <a href="/interiors/handles/doorhandles.html" class="product-link">
          <picture>
            <!-- Web / Desktop -->
            <source media="(min-width: 768px)" srcset="/images/Handles/mandellilogo.png">
            <!-- Mobile -->
            <img src="/images/Handles/mandellilogo.png"> alt="Mandelli" class="brand-logo">
          </picture>
        </a>
      </div>

      <!-- Fimet -->
      <div class="brand fimet">
        <a href="/interiors/handles/fimethandles.html" class="product-link">
          <picture>
            <!-- Web / Desktop -->
            <source media="(min-width: 768px)" srcset="/images/Handles/fimet/fimetlogo.png">
            <!-- Mobile -->
            <img src="/images/Handles/fimet/fimetlogo.png" alt="Fimet" class="brand-logo">
          </picture>
        </a>
      </div>
    </section>

    <!-- Footer -->
    <section class="home-header">
        <div id="footer-container"></div>
    </section>

<!-- Link to the external script file -->
<script src="/script.js"></script>
</body>
</html>
