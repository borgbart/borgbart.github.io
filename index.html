<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BB2000</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;600;700&display=swap">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="icon" href="/images/flavicon.png" type="image/x-icon">
</head>

<body>

    <div id="login-overlay" class="login-overlay">
        <div class="login-box">
          <h2>Login</h2>
          <input type="text" id="username" placeholder="Username" />
          <input type="password" id="password" placeholder="Password" />
          <button onclick="login()">Login</button>
          <div class="error" id="error"></div>
        </div>
      </div>      
      
    <div class="wrapper">
        <!-- nav.html -->
        <section class="home-header">
            <div id="nav-container"></div>
        </section>
    
        <section class="hero">
            <picture>
              <!-- Web Version Image -->
              <source media="(min-width: 768px)" srcset="images/pods_banner.png">
              <!-- Mobile Version Image -->
              <img src="/images/pods_mobilebanner.png" alt="Welcome Image" class="hero-image">
            </picture>
          </section>

        <section class="body">
            <div class="home-title"><h1>Categories</h1></div>
            <div class="row">
                <div class="col">
                    <a href="workspace.html"><img src="images/workspace/workspace.png" alt=""></a>
                    <div class="layer">
                        <h3><a href="workspace.html">Workspace</a></h3>
                    </div>
                </div>
                <div class="col">
                    <a href="/lifestyle.html"><img src="/images/lifestyle.png" alt=""></a>
                    <div class="layer">
                        <h3><a href="/lifestyle.html">Lifestyle</a></h3>
                    </div>
                </div>
                <div class="col">
                    <a href="/outdoors.html"><img src="/images/equipment.jpg" alt=""></a>
                    <div class="layer">
                        <h3><a href="/outdoors.html">Outdoors</a></h3>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <section class="home-header">
        <div id="footer-container"></div>
    </section>

    <!-- Link to the external script file -->
    <script src="/script.js"></script>

    <script>
        const VALID_USERNAME = "borgbarthet";
        const VALID_PASSWORD = "bb2000";
      
        function login() {
          const username = document.getElementById("username").value;
          const password = document.getElementById("password").value;
          const errorBox = document.getElementById("error");
      
          if (username === VALID_USERNAME && password === VALID_PASSWORD) {
            localStorage.setItem("authenticated", "true");
            document.getElementById("login-overlay").style.display = "none";
          } else {
            errorBox.textContent = "Invalid credentials. Please try again.";
          }
        }
      
        window.onload = function () {
          const isAuthenticated = localStorage.getItem("authenticated");
          if (isAuthenticated === "true") {
            document.getElementById("login-overlay").style.display = "none";
          }
        };
      </script>
      
</body>
</html>
